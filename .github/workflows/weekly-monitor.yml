name: Weekly frozen seafood monitor

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/weekly-monitor.yml"
      - "coles_monitor/**"
      - "config.json"
      - "requirements.txt"
      - "run_monitor.py"
      - "tests/**"
      - ".send-latest-once"
      - ".send-test-once"
      - ".send-multibuy-test-once"
  schedule:
    # 06:00 AEST every Wednesday (fixed UTC+10; 07:00 local during AEDT).
    - cron: "0 20 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-frozen-seafood-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Send explicit multibuy test once
        if: ${{ hashFiles('.send-multibuy-test-once') != '' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_monitor.py --send-multibuy-test

      - name: Retire multibuy-test marker
        if: ${{ hashFiles('.send-multibuy-test-once') != '' }}
        run: |
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git rm .send-multibuy-test-once
          git commit -m "Mark multibuy test as sent"
          git push

      - name: Send current catalogue test once
        if: ${{ hashFiles('.send-test-once') != '' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_monitor.py --send-existing-baseline

      - name: Retire catalogue-test marker
        if: ${{ hashFiles('.send-test-once') != '' }}
        run: |
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git rm .send-test-once
          git commit -m "Mark catalogue test as sent"
          git push

      - name: Resend latest captured update once
        if: ${{ hashFiles('.send-latest-once') != '' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_monitor.py --send-latest-events

      - name: Retire latest-update resend marker
        if: ${{ hashFiles('.send-latest-once') != '' }}
        run: |
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git rm .send-latest-once
          git commit -m "Mark latest update resend as sent"
          git push

      - name: Send requested baseline test email once
        if: ${{ github.event_name != 'push' && hashFiles('.send-baseline-once') != '' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python run_monitor.py --send-existing-baseline

      - name: Retire one-time baseline email marker
        if: ${{ github.event_name != 'push' && hashFiles('.send-baseline-once') != '' }}
        run: |
          git config user.name "coles-monitor[bot]"
          git config user.email "coles-monitor[bot]@users.noreply.github.com"
          git rm .send-baseline-once
          git commit -m "Mark baseline test email as sent"
          git push

      - name: Scrape, compare, record and notify
        if: ${{ github.event_name != 'push' }}
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          COLES_BUILD_ID: ${{ secrets.COLES_BUILD_ID }}
          RETAIL_PROXY_URL: ${{ secrets.RETAIL_PROXY_URL }}
        run: python run_monitor.py --email-baseline

      - name: Commit updated snapshot and history
        if: ${{ github.event_name != 'push' }}
        run: |
          if git diff --quiet -- data; then
            echo "No state changes to commit."
            exit 0
          fi
          git config user.name "frozen-seafood-monitor[bot]"
          git config user.email "frozen-seafood-monitor[bot]@users.noreply.github.com"
          git add data/current.json data/events.json data/coles-woolworths-frozen-seafood-change-history.xlsx
          git commit -m "Update frozen seafood product snapshot"
          git push

      - name: Upload Excel history
        if: ${{ github.event_name != 'push' }}
        uses: actions/upload-artifact@v4
        with:
          name: coles-woolworths-frozen-seafood-change-history
          path: data/coles-woolworths-frozen-seafood-change-history.xlsx
          if-no-files-found: error
